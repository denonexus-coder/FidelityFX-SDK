name: Compile FidelityFX ARM64 (real repo files)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: main
          fetch-depth: 1

      - name: Setup cross-compile ARM64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu \
            libvulkan-dev aarch64-linux-gnu-binutils

      - name: Build with real repo files (internal + SDK backend)
        run: |
          chmod +x compile_arm64_custom.sh
          bash compile_arm64_custom.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-libmcfsr-real
          path: build_arm64/*.so
