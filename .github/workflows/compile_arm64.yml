name: Compile FidelityFX ARM64 (custom build)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: main
          fetch-depth: 1

      - name: Setup ARM64 cross-compile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu \
            libvulkan-dev aarch64-linux-gnu-binutils || true

      - name: Custom build
        run: |
          chmod +x compile_arm64_custom.sh || true
          bash compile_arm64_custom.sh || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-libmcfsr-custom
          path: build_arm64/*.so
