name: Compile FidelityFX ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ARM64 cross-compile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential g++-aarch64-linux-gnu libvulkan-dev

      - name: Build
        run: |
          chmod +x compile_arm64_custom.sh
          bash compile_arm64_custom.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: arm64-libmcfsr
          path: build_arm64/*.so

